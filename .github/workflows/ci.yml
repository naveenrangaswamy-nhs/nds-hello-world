# Checks every pull request and every push to main. Nothing here talks to AWS:
# deploys still run from a workstation with ./infra/deploy.sh until the
# organisation allows a GitHub OIDC provider in the account.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

      # The same build that ./infra/deploy.sh packages for Lambda.
      - run: npm run build:lambda

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.17"

      - run: terraform fmt -check -recursive -diff infra

      # -backend=false: validate the configuration without touching remote state.
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate

      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
